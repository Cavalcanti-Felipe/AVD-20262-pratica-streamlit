# Configuração do Streamlit: identidade visual do app (azul Olist).
# O tema pode ser trocado pelo menu ⋮ → Settings → Choose app theme.

[theme]
paddingTop = "0.0rem"     # espaço abaixo da barra do topo (valor entre aspas)
font = "sans serif"       # "sans serif", "serif" ou "monospace"

[theme.light]
primaryColor = "#1f5fbf"            # cor de destaque (widgets, links): mesmo azul dos gráficos
backgroundColor = "#ffffff"         # fundo da página
secondaryBackgroundColor = "#eef3fb"  # fundo da sidebar e de widgets (azul bem claro)
textColor = "#1f2933"               # cor do texto
borderColor = "#d5dde8"

[theme.dark]
primaryColor = "#5b8def"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1b2332"
textColor = "#fafafa"
borderColor = "#3a4456"
